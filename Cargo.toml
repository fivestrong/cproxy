[package]
name = "cproxy"
version = "4.2.4"
authors = ["Xiangru Lian <admin@mail.xrlian.com>"]
description = "Transparent proxy built on cgroup net_cls."
homepage = "https://github.com/NOBLES5E/cproxy"
license = "MIT"
edition = "2018"

[dependencies]
cgroups-rs = "0.3"
cmd_lib = "1.9"
color-eyre = "0.6"
ctrlc = "3.4"
eyre = "0.6"
flume = "0.11"
libc = "0.2"
nix = { version = "0.29", features = ["user"] }
structopt = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
with_drop = "0.0.3"
