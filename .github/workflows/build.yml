on: [push, pull_request]

name: check and test

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  e2e-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iptables nftables iproute2 socat curl dnsutils

      - name: Build cproxy
        run: |
          cargo build --release

      - name: Prepare Test Environment
        run: |
          mkdir -p test/logs
          chmod +x test/*.sh
          sudo install -m 755 target/release/cproxy /usr/local/bin

      - name: Run Redirect Mode Tests
        run: |
          sudo ./test/run_all_tests.sh

      - name: Run Upstream (HTTP/SOCKS5) Tests
        run: |
          sudo ./test/run_upstream_tests.sh

      - name: Run nft Backend Tests
        run: |
          sudo ./test/run_nft_backend_tests.sh
